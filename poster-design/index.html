<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="一款支持画布、背景、文字与图层编辑的单页海报设计工具。">
  <title>Folio 海报设计台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;600;700;800;900&family=Noto+Serif+SC:wght@600;700;900&family=Space+Grotesk:wght@500;600;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --app-bg: #111210;
      --panel: #181a17;
      --panel-soft: #1e201d;
      --panel-raised: #242622;
      --line: #30332e;
      --line-strong: #44483f;
      --text: #f3f1e9;
      --muted: #959a8d;
      --accent: #d7ff45;
      --accent-ink: #171b09;
      --danger: #ff796f;
      --focus: rgba(215, 255, 69, 0.35);
      --radius-sm: 7px;
      --radius-md: 11px;
      --header-height: 64px;
      font-family: "Noto Sans SC", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      overflow: hidden;
      background: var(--app-bg);
      color: var(--text);
      font-size: 13px;
    }

    button, input, select, textarea { font: inherit; }

    button { color: inherit; }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .app {
      display: grid;
      grid-template-rows: var(--header-height) minmax(0, 1fr);
      height: 100%;
      min-width: 320px;
    }

    .topbar {
      position: relative;
      z-index: 10;
      display: grid;
      grid-template-areas: "brand controls actions";
      grid-template-columns: minmax(150px, 1fr) minmax(0, auto) minmax(150px, 1fr);
      grid-template-rows: var(--header-height);
      align-items: center;
      gap: 12px;
      min-width: 0;
      padding: 0 18px;
      border-bottom: 1px solid var(--line);
      background: #151613;
    }

    .brand {
      grid-area: brand;
      display: flex;
      align-items: center;
      gap: 11px;
      font-family: "Space Grotesk", "Noto Sans SC", sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: var(--accent);
      color: var(--accent-ink);
      font-size: 17px;
      transform: rotate(-3deg);
    }

    .brand small {
      display: block;
      margin-top: 1px;
      color: var(--muted);
      font-family: "Noto Sans SC", sans-serif;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.1em;
    }

    .header-controls {
      grid-area: controls;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-width: 0;
      height: var(--header-height);
      overflow-x: auto;
      padding: 0 2px;
      scrollbar-width: none;
    }

    .header-controls::-webkit-scrollbar { display: none; }

    .top-actions {
      grid-area: actions;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 9px;
    }

    .top-actions .button { white-space: nowrap; }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 34px;
      padding: 0 12px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-sm);
      background: var(--panel-soft);
      color: var(--text);
      cursor: pointer;
      transition: border-color 160ms ease, background 160ms ease, color 160ms ease, transform 120ms ease;
    }

    .button:hover { border-color: #686d5e; background: #292c27; }
    .button:active { transform: translateY(1px); }
    .button.primary { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); font-weight: 700; }
    .button.primary:hover { background: #e0ff6d; }
    .button.icon-only { width: 34px; padding: 0; }
    .button:disabled { cursor: not-allowed; opacity: 0.4; }

    .icon {
      width: 16px;
      height: 16px;
      flex: none;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    .workspace {
      display: grid;
      grid-template-columns: 288px minmax(380px, 1fr) 258px;
      min-height: 0;
    }

    .sidebar {
      min-height: 0;
      overflow: auto;
      scrollbar-width: thin;
      scrollbar-color: #464a40 transparent;
      background: var(--panel);
    }

    .sidebar.left { border-right: 1px solid var(--line); }
    .sidebar.right { border-left: 1px solid var(--line); }

    .panel-section {
      padding: 20px;
      border-bottom: 1px solid var(--line);
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .section-title {
      margin: 0;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .section-note { color: var(--muted); font-size: 11px; }

    .ratio-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
    }

    .ratio-button {
      display: grid;
      gap: 4px;
      min-height: 56px;
      place-items: center;
      padding: 7px 4px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--panel-soft);
      color: var(--muted);
      cursor: pointer;
      transition: 160ms ease;
    }

    .ratio-button:hover { border-color: var(--line-strong); color: var(--text); }
    .ratio-button.active { border-color: var(--accent); background: rgba(215, 255, 69, 0.08); color: var(--accent); }
    .ratio-button strong { font-size: 12px; }
    .ratio-button span { font-size: 9px; }

    .ratio-shape {
      display: block;
      width: 16px;
      height: 20px;
      border: 1.5px solid currentColor;
      border-radius: 2px;
    }

    .ratio-shape.square { height: 16px; }
    .ratio-shape.landscape { width: 22px; height: 14px; }
    .ratio-shape.story { width: 12px; height: 21px; }

    .field-row {
      display: grid;
      grid-template-columns: 1fr 18px 1fr;
      align-items: end;
      gap: 7px;
      margin-top: 13px;
    }

    .field-row .times { padding-bottom: 9px; color: var(--muted); text-align: center; }

    .field { display: grid; gap: 7px; min-width: 0; }

    .field label,
    .field-label { color: var(--muted); font-size: 11px; font-weight: 500; }

    .input,
    .select,
    .textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: #131512;
      color: var(--text);
      transition: border-color 160ms ease, background 160ms ease;
    }

    .input, .select { height: 36px; padding: 0 10px; }
    .textarea { min-height: 74px; padding: 9px 10px; resize: vertical; line-height: 1.55; }
    .input:hover, .select:hover, .textarea:hover { border-color: var(--line-strong); }
    .input:disabled, .select:disabled, .textarea:disabled { opacity: 0.45; cursor: not-allowed; }

    .full-button { width: 100%; margin-top: 9px; }

    .swatch-grid {
      display: grid;
      grid-template-columns: repeat(6, 36px);
      gap: 6px;
      justify-content: start;
    }

    .swatch {
      position: relative;
      aspect-ratio: 1;
      padding: 0;
      overflow: hidden;
      border: 2px solid transparent;
      border-radius: 6px;
      background: var(--swatch);
      cursor: pointer;
      transition: border-color 160ms ease, transform 160ms ease;
    }

    .swatch:hover { transform: translateY(-2px); }
    .swatch.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--panel), 0 0 0 2px var(--accent); }

    .swatch.upload-swatch {
      display: grid;
      place-items: center;
      border: 1px dashed var(--line-strong);
      background: #20221e;
      color: var(--muted);
    }

    .swatch.upload-swatch:hover { border-color: #777d6c; color: var(--text); }
    .swatch.upload-swatch.active { border-style: solid; border-color: var(--accent); color: var(--accent); }
    .swatch.upload-swatch .icon { width: 15px; height: 15px; }

    .custom-background {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 13px;
    }

    .color-field {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 36px;
      padding: 5px 8px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: #131512;
    }

    .color-field input[type="color"] {
      width: 23px;
      height: 23px;
      padding: 0;
      border: 0;
      border-radius: 5px;
      background: transparent;
      cursor: pointer;
    }

    .color-field span { overflow: hidden; color: var(--muted); font-family: "Space Grotesk", monospace; font-size: 10px; text-overflow: ellipsis; }

    .editor-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .editor-grid .wide { grid-column: 1 / -1; }

    .style-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }

    .style-button {
      display: grid;
      place-items: center;
      height: 34px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #131512;
      color: var(--muted);
      cursor: pointer;
    }

    .style-button:hover { color: var(--text); border-color: var(--line-strong); }
    .style-button.active { border-color: var(--accent); background: rgba(215, 255, 69, 0.08); color: var(--accent); }
    .style-button:disabled { opacity: 0.4; cursor: not-allowed; }

    .range-row { display: flex; align-items: center; gap: 10px; }
    .range-row input[type="range"] { width: 100%; accent-color: var(--accent); }
    .range-value { min-width: 34px; color: var(--muted); font-family: "Space Grotesk", monospace; text-align: right; }

    .stage-column {
      display: grid;
      grid-template-rows: minmax(0, 1fr);
      min-width: 0;
      min-height: 0;
      background: #0f100e;
    }

    .canvas-summary {
      display: flex;
      align-items: center;
      gap: 7px;
      flex: none;
      min-height: 34px;
      padding: 0 10px;
      border-right: 1px solid var(--line-strong);
      color: var(--muted);
    }

    .canvas-summary strong { color: var(--text); font-family: "Space Grotesk", monospace; font-size: 12px; white-space: nowrap; }

    .header-controls .ratio-grid { display: flex; gap: 5px; flex: none; }

    .header-controls .ratio-button {
      display: flex;
      gap: 6px;
      min-height: 34px;
      padding: 0 9px;
      white-space: nowrap;
    }

    .header-controls .ratio-button .ratio-shape { display: none; }
    .header-controls .ratio-button span { color: var(--muted); font-size: 9px; }
    .header-controls .ratio-button.active span { color: var(--accent); opacity: 0.72; }

    .header-size-fields {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: none;
      padding-left: 4px;
    }

    .header-size-fields .input { width: 76px; min-height: 34px; padding: 0 9px; font-family: "Space Grotesk", monospace; }
    .header-size-fields .times { color: var(--muted); }
    .header-size-fields .button { min-height: 34px; padding: 0 11px; }

    .zoom-control { display: flex; align-items: center; gap: 7px; flex: none; padding: 0 4px 0 8px; border-left: 1px solid var(--line-strong); }
    .zoom-control input { width: 88px; accent-color: var(--accent); }
    .zoom-control span { min-width: 36px; color: var(--muted); font-family: "Space Grotesk", monospace; font-size: 11px; text-align: right; }

    .stage-viewport {
      position: relative;
      min-height: 0;
      overflow: hidden;
      padding: 48px;
      background-color: #10110f;
      background-image: radial-gradient(circle, #2a2c27 0.8px, transparent 0.8px);
      background-size: 18px 18px;
      scrollbar-width: thin;
      scrollbar-color: #44483f transparent;
    }

    .canvas-centering {
      display: grid;
      min-width: 100%;
      min-height: 100%;
      place-items: center;
    }

    .canvas-shell {
      position: relative;
      flex: none;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.1);
      transition: width 180ms ease, height 180ms ease;
    }

    .poster-canvas {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      user-select: none;
      isolation: isolate;
    }

    .canvas-layer {
      position: absolute;
      display: flex;
      align-items: flex-start;
      border: 1px solid transparent;
      cursor: move;
      touch-action: none;
    }

    .canvas-layer:hover { border-color: rgba(255, 255, 255, 0.46); }
    .canvas-layer.selected { border-color: var(--accent); }
    .canvas-layer.editing { border-color: var(--accent); cursor: text; }
    .canvas-layer.preview-mode { border-color: transparent !important; cursor: default; }

    .text-content {
      width: 100%;
      color: inherit;
      font: inherit;
      line-height: 0.96;
      overflow-wrap: normal;
      word-break: normal;
      pointer-events: none;
      white-space: pre;
    }

    .canvas-layer.editing .text-content {
      min-height: 1em;
      outline: none;
      caret-color: var(--accent);
      cursor: text;
      pointer-events: auto;
      user-select: text;
    }

    .resize-handle {
      position: absolute;
      right: -6px;
      bottom: -6px;
      display: none;
      width: 12px;
      height: 12px;
      border: 2px solid #151613;
      border-radius: 2px;
      background: var(--accent);
      cursor: nwse-resize;
    }

    .canvas-layer.selected .resize-handle { display: block; }
    .canvas-layer.editing .resize-handle { display: none; }
    .canvas-layer.preview-mode .resize-handle { display: none; }

    .preview-badge {
      position: absolute;
      top: 14px;
      left: 50%;
      z-index: 20;
      display: none;
      padding: 5px 9px;
      border-radius: 999px;
      background: rgba(17, 18, 16, 0.82);
      color: #fff;
      font-size: 10px;
      letter-spacing: 0.08em;
      pointer-events: none;
      transform: translateX(-50%);
    }

    .preview-badge.visible { display: block; }

    .layers-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 16px 12px;
    }

    .layer-add-control { position: relative; }

    .layer-add-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      z-index: 70;
      width: 174px;
      padding: 6px;
      border: 1px solid var(--line-strong);
      border-radius: 9px;
      background: #20221e;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
    }

    .layer-add-option {
      display: grid;
      grid-template-columns: 30px 1fr;
      align-items: center;
      gap: 9px;
      width: 100%;
      min-height: 42px;
      padding: 5px 8px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--text);
      text-align: left;
      cursor: pointer;
    }

    .layer-add-option:hover { background: #30332d; }

    .layer-add-option-icon {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      color: var(--muted);
      font-family: "Noto Serif SC", serif;
      font-size: 13px;
      font-weight: 700;
    }

    .layer-add-option-copy strong,
    .layer-add-option-copy small { display: block; }
    .layer-add-option-copy strong { font-size: 12px; }
    .layer-add-option-copy small { margin-top: 2px; color: var(--muted); font-size: 9px; }

    .layers-list { display: grid; gap: 6px; padding: 0 10px 12px; }

    .layer-row {
      display: grid;
      grid-template-columns: 30px 34px minmax(0, 1fr) auto;
      align-items: center;
      min-height: 54px;
      padding: 4px 7px 4px 5px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      cursor: pointer;
      transition: 150ms ease;
    }

    .layer-row:hover { background: var(--panel-soft); }
    .layer-row.active { border-color: #4e5347; background: var(--panel-raised); }
    .layer-row.dimmed { opacity: 0.48; }

    .layer-visibility,
    .layer-delete {
      display: grid;
      place-items: center;
      width: 27px;
      height: 27px;
      padding: 0;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }

    .layer-visibility:hover, .layer-delete:hover { background: #30332d; color: var(--text); }
    .layer-delete:hover { color: var(--danger); }

    .layer-thumb {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      background: #121310;
      color: var(--muted);
      font-family: "Noto Serif SC", serif;
      font-size: 14px;
      font-weight: 700;
    }

    .layer-thumb.image-thumb { overflow: hidden; border-color: #555a4e; }
    .layer-thumb.image-thumb img { width: 100%; height: 100%; object-fit: cover; }

    .image-content {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
      pointer-events: none;
      user-select: none;
    }

    .layer-copy { min-width: 0; padding: 0 8px; }
    .layer-copy strong, .layer-copy small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .layer-copy strong { font-size: 12px; font-weight: 600; }
    .layer-copy small { margin-top: 3px; color: var(--muted); font-size: 10px; }

    .background-row { cursor: default; }
    .background-thumb { border: 0; background: var(--current-background); }

    .layer-order-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      padding: 12px 16px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .tip-card {
      margin: 16px;
      padding: 13px;
      border-left: 2px solid var(--accent);
      background: rgba(215, 255, 69, 0.05);
      color: var(--muted);
      font-size: 11px;
      line-height: 1.65;
    }

    .tip-card strong { color: var(--text); }

    .toast {
      position: fixed;
      bottom: 22px;
      left: 50%;
      z-index: 100;
      padding: 9px 13px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: #23251f;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
      color: var(--text);
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 10px);
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .toast.visible { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 1320px) {
      #previewButton .button-label { display: none; }
    }

    @media (max-width: 1240px) {
      .header-controls { gap: 7px; }
      .canvas-summary { padding: 0 8px; }
      .canvas-summary > span,
      .header-controls .ratio-button span { display: none; }
      .header-controls .ratio-button { padding: 0 9px; }
      .header-size-fields .input { width: 68px; }
      .zoom-control input { width: 68px; }
    }

    @media (max-width: 1040px) {
      .workspace { grid-template-columns: 254px minmax(360px, 1fr) 220px; }
      .panel-section { padding: 16px; }
      .topbar { grid-template-columns: minmax(130px, 1fr) minmax(0, auto) minmax(80px, 1fr); gap: 8px; }
      .button .button-label { display: none; }
    }

    @media (max-width: 820px) {
      body { overflow: auto; }
      .app { height: auto; min-height: 100%; }
      .topbar { position: sticky; top: 0; grid-template-areas: "brand controls actions"; grid-template-columns: auto minmax(0, 1fr) auto; padding: 0 12px; }
      .brand { font-size: 13px; }
      .brand small { display: none; }
      .header-controls { justify-content: flex-start; gap: 7px; }
      .zoom-control input { width: 64px; }
      .workspace { grid-template-columns: 1fr; grid-template-rows: auto minmax(620px, 70vh) auto; }
      .sidebar.left { border-right: 0; border-bottom: 1px solid var(--line); }
      .sidebar.right { border-top: 1px solid var(--line); border-left: 0; }
      .sidebar { overflow: visible; }
      .stage-column { grid-row: 1; min-height: 620px; }
      .sidebar.left { grid-row: 2; }
      .sidebar.right { grid-row: 3; }
      .stage-viewport { padding: 28px; }
      .panel-section { padding: 18px; }
    }

    @media (max-width: 560px) {
      .brand > div:last-child { display: none; }
      .header-controls { gap: 6px; }
      .zoom-control { gap: 4px; padding-right: 2px; }
      .zoom-control .icon { display: none; }
      .zoom-control input { width: 52px; }
      .top-actions { gap: 5px; }
      .button { padding: 0 9px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">F</div>
        <div>FOLIO <small>POSTER STUDIO</small></div>
      </div>
      <div class="header-controls" aria-label="画布视图控制">
        <div class="canvas-summary"><span>画布</span><strong id="canvasInfo">800 × 1000</strong></div>
        <div class="ratio-grid" id="ratioGrid" aria-label="常用画布比例">
          <button class="ratio-button" type="button" data-width="1080" data-height="1080"><i class="ratio-shape square"></i><strong>1 : 1</strong><span>方图</span></button>
