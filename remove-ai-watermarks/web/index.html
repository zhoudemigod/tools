<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>AI 水印清理 · 开源好物集</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%234186f5'/%3E%3Cpath d='M9 9h14v14H9zM12 19l3-4 2 2 2-3 2 5z' fill='none' stroke='white' stroke-width='1.5'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <main class="app">
      <header>
        <div class="brand">
          <svg class="brand-logo" viewBox="0 0 32 32" aria-hidden="true">
            <circle cx="16" cy="16" r="16" fill="#4186f5" />
            <path d="M8.5 9.5h15v13h-15zM11 19l3.5-4 2.4 2.3 2.3-3 2.8 3.8" fill="none" stroke="white" stroke-width="1.5" stroke-linejoin="round" />
            <circle cx="12.5" cy="13" r="1.4" fill="white" />
          </svg>
          <div class="brand-copy">
            <span class="brand-name">开源好物集</span>
            <h1>AI 水印清理</h1>
          </div>
        </div>
        <span class="privacy">本地处理</span>
      </header>

      <div class="layout">
        <section class="viewer" aria-label="图片处理区域">
          <div class="bar">
            <span id="fileName">图片工作区</span>
            <div class="bar-meta">
              <span id="dimensions">尚未选择图片</span>
              <button class="bar-button" id="replaceButton" type="button" hidden>更换图片</button>
            </div>
          </div>

          <div class="stage" id="dropZone">
            <div class="empty" id="emptyState">
              <span class="empty-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                  <rect x="3" y="4" width="18" height="16" rx="2" />
                  <circle cx="8" cy="9" r="1.5" />
                  <path d="m4 17 5-5 4 4 3-4 4 5" />
                </svg>
              </span>
              <h2>上传一张图片</h2>
              <button class="primary" id="uploadButton" type="button">选择图片</button>
              <span>JPG · PNG · WebP</span>
            </div>

            <div class="editor" id="editor" hidden>
              <div
                class="compare-view"
                id="compareView"
                tabindex="0"
                role="group"
                aria-label="图片编辑区域；处理后移动鼠标可对比原图和结果"
              >
                <img class="compare-image result-image" id="resultImage" alt="处理后图片" draggable="false" />
                <img class="compare-image original-image" id="sourceImage" alt="原始图片" draggable="false" />
                <div class="compare-line" id="compareLine" aria-hidden="true"><span></span></div>
                <span class="compare-label label-before">原图</span>
                <span class="compare-label label-after">处理后</span>
              </div>
            </div>
          </div>
        </section>

        <aside class="settings" aria-label="水印处理设置">
          <div class="settings-heading">
            <h2>AI 自动去除</h2>
            <span class="engine-pill">LaMa</span>
          </div>

          <button class="primary process-button" id="processButton" type="button" disabled>
            <span class="button-label">去除水印</span>
            <span class="button-loader" aria-hidden="true"></span>
          </button>

          <button class="secondary" id="downloadButton" type="button" hidden>下载结果</button>

          <p class="status" id="statusMessage" role="status" aria-live="polite">
            选择图片后即可处理。
          </p>
        </aside>
      </div>

      <footer>
        <span>文件不上传 · 处理后自动清理</span>
        <span>JPG · PNG · WebP · 最大 20 MB</span>
      </footer>

      <input id="imageInput" type="file" accept="image/jpeg,image/png,image/webp" hidden />
    </main>
    <script src="/assets/app.js" defer></script>
  </body>
</html>
