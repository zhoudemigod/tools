[project]
name = "watermark-cleaner-web"
version = "0.1.0"
description = "Local web interface for removing registered visible AI watermarks from authorized images"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "c2pa-python==0.38.0",
  "fastapi>=0.115,<1",
  "python-multipart>=0.0.20,<1",
  "remove-ai-watermarks[visible]==0.54.0",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
watermark-cleaner = "watermark_web.app:run"

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/watermark_web"]

[tool.hatch.build.targets.wheel.force-include]
"web" = "watermark_web/web"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
